spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hobbietrades}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=${PORT:8080}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
huggingface.api.key=${HUGGINGFACE_API_KEY}
upload.dir=uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=55MB
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.mvc.static-path-pattern=/**

# Price scraping — Facebook public pages only (legacy = Shopee/Amazon/etc.)
hobbietrades.scrape.provider=facebook
hobbietrades.scrape.enabled=true
hobbietrades.scrape.delay-ms=2500
hobbietrades.scrape.max-keywords-per-run=12
hobbietrades.scrape.on-startup=false
hobbietrades.scrape.facebook.public-pages=GuitarBuyAndSellPhilippines,CameraGearPhilippines,MusicGearBuyAndSellPH,UsedCameraPhilippines
# Optional: set on Render to protect POST /api/prices/scrape-run
hobbietrades.admin-key=