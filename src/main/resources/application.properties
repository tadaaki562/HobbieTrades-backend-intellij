spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hobbietrades}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
server.port=${PORT:8080}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
huggingface.api.key=${HUGGINGFACE_API_KEY}

# Roboflow Workflows — see docs/ROBOFLOW.md
roboflow.enabled=${ROBOFLOW_ENABLED:false}
roboflow.api.key=${ROBOFLOW_API_KEY:}
roboflow.workspace=${ROBOFLOW_WORKSPACE:hobbietrades-dataset}
roboflow.camera.workflow-id=${ROBOFLOW_CAMERA_WORKFLOW_ID:detect-and-classify-3}
roboflow.instruments.workflow-id=${ROBOFLOW_INSTRUMENTS_WORKFLOW_ID:detect-and-classify-2}
roboflow.camera.use-workflow=${ROBOFLOW_CAMERA_USE_WORKFLOW:true}
roboflow.instruments.use-workflow=${ROBOFLOW_INSTRUMENTS_USE_WORKFLOW:true}
roboflow.serverless-base=https://serverless.roboflow.com
roboflow.workflow.request-timeout-seconds=45
# false = always load latest published workflow (avoids 15-min stale cache with old car-colors step)
roboflow.workflow.use-cache=${ROBOFLOW_WORKFLOW_USE_CACHE:false}
roboflow.workflow.fallback-on-error=true
# Direct detection models (fallback when workflow fails or use-workflow=false)
roboflow.camera.project=${ROBOFLOW_CAMERA_PROJECT:camera-detection}
roboflow.camera.version=${ROBOFLOW_CAMERA_VERSION:1}
roboflow.instruments.project=${ROBOFLOW_INSTRUMENTS_PROJECT:musical-instruments-detection-kemni-bzqvi}
roboflow.instruments.version=${ROBOFLOW_INSTRUMENTS_VERSION:2}

upload.dir=uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=55MB
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.mvc.static-path-pattern=/**

# Price scraping — Facebook public pages only (legacy = Shopee/Amazon/etc.)
hobbietrades.scrape.provider=facebook
hobbietrades.scrape.enabled=true
hobbietrades.scrape.delay-ms=2500
hobbietrades.scrape.max-keywords-per-run=12
hobbietrades.scrape.on-startup=false
hobbietrades.scrape.facebook.public-pages=GuitarBuyAndSellPhilippines,CameraGearPhilippines,MusicGearBuyAndSellPH,UsedCameraPhilippines
# Optional: set on Render to protect POST /api/prices/scrape-run
hobbietrades.admin-key=